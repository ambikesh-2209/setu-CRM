<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Setu — Sales Companion</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --navy:#1B2A41; --navy-light:#2C4165; --amber:#C9852B; --amber-light:#E6A954;
    --paper:#F7F5F0; --card:#FFFFFF; --ink:#1F2328; --slate:#6B7280; --line:#E4E1D8;
    --green:#2F7D5C; --red:#B4432F; --teal:#2A7D8C; --purple:#6B5B95; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); padding-bottom:76px; position:relative;}
  header.topbar{background:var(--navy); color:#fff; padding:18px 18px 16px; position:sticky; top:0; z-index:20;}
  header.topbar .brand{display:flex; align-items:baseline; gap:8px;}
  header.topbar .brand-mark{font-size:20px; font-weight:700; letter-spacing:0.3px;}
  header.topbar .brand-sub{font-size:12px; color:#B9C3D4;}
  header.topbar .screen-title{font-size:22px; font-weight:600; margin-top:10px; padding-right:44px;}
  header.topbar .gbtn{position:absolute; right:16px; top:16px; width:36px;height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.14); color:#fff; font-size:13px; font-weight:700; cursor:pointer;}
  header.topbar .gbtn.connected{background:var(--green);}
  main{padding:16px;}
  .section-label{font-size:13px; font-weight:600; color:var(--slate); margin:18px 4px 8px; display:flex; justify-content:space-between; align-items:center;}
  .section-label a{font-size:12px; color:var(--navy); font-weight:600; cursor:pointer;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
  .stat-box .num{font-size:26px; font-weight:700; color:var(--navy); line-height:1;}
  .stat-box .lbl{font-size:12.5px; color:var(--slate); margin-top:6px;}
  .signin-banner{background:#EAF1FB; border:1px solid #C7D9F0; border-radius:10px; padding:12px; margin-bottom:14px; font-size:13px; color:#1B3A66;}
  .signin-banner button{margin-top:8px;}
  .lead-row{display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--slate); border-radius:8px; padding:12px 12px; margin-bottom:8px; cursor:pointer;}
  .lead-row .info{flex:1; min-width:0;}
  .lead-row .name{font-weight:600; font-size:15.5px;}
  .lead-row .meta{font-size:12.5px; color:var(--slate); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lead-row .stage-tag{font-size:11px; font-weight:600; padding:4px 8px; border-radius:20px; white-space:nowrap; margin-left:8px;}
  .row-actions{display:flex; gap:6px; margin-left:8px;}
  .icon-mini{width:30px;height:30px; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; text-decoration:none; color:var(--ink); flex:none;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--slate);}
  .empty-state .big{font-size:36px; margin-bottom:10px;}
  .fab{position:fixed; right:20px; bottom:88px; width:56px;height:56px; border-radius:50%; background:var(--amber); color:#fff; border:none; font-size:28px; box-shadow:0 4px 14px rgba(0,0,0,0.25); cursor:pointer; z-index:25; max-width:480px;}
  nav.bottombar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30;}
  nav.bottombar button{flex:1; background:none; border:none; padding:10px 0 8px; font-size:11px; color:var(--slate); cursor:pointer;}
  nav.bottombar button .ic{display:block; font-size:19px; margin-bottom:2px;}
  nav.bottombar button.active{color:var(--navy); font-weight:700;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .field label .req{color:var(--red);}
  .field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; color:var(--ink); font-family:inherit;}
  .field textarea{min-height:70px; resize:vertical;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 13px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:13.5px; color:var(--ink); cursor:pointer;}
  .chip.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
  .outcome-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .outcome-opt{border:1.5px solid var(--line); border-radius:8px; padding:10px 8px; text-align:center; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); background:#fff;}
  .outcome-opt.selected{color:#fff; border-color:transparent;}
  .modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,0.5); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{background:var(--paper); width:100%; max-width:480px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; animation:slideup 0.22s ease-out;}
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-header{position:sticky; top:0; background:var(--paper); display:flex; align-items:center; justify-content:space-between; padding:16px 16px 12px; border-bottom:1px solid var(--line); z-index:2;}
  .modal-header h2{margin:0; font-size:17px;}
  .modal-header button{background:none; border:none; font-size:15px; cursor:pointer; padding:4px 6px;}
  .btn-cancel{color:var(--slate);}
  .btn-save{color:var(--navy); font-weight:700;}
  .modal-body{padding:16px;}
  .fieldset-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--slate); margin:20px 0 10px;}
  .detail-header{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .detail-header .name{font-size:19px; font-weight:700;}
  .detail-header .sub{font-size:13px; color:var(--slate); margin-top:4px;}
  .call-row{display:flex; gap:10px; margin-top:12px;}
  .call-row a{flex:1; text-align:center; padding:10px; border-radius:8px; font-size:13.5px; font-weight:600; text-decoration:none;}
  .call-row a.call{background:var(--navy); color:#fff;}
  .call-row a.wa{background:#e7f5ee; color:var(--green);}
  .visit-item{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--slate); border-radius:8px; padding:12px; margin-bottom:10px;}
  .visit-item .vhead{display:flex; justify-content:space-between; align-items:center;}
  .visit-item .vdate{font-size:12.5px; color:var(--slate);}
  .visit-item .voutcome{font-size:12px; font-weight:700; padding:3px 9px; border-radius:14px; color:#fff;}
  .visit-item .vnotes{font-size:13.5px; margin-top:8px; color:var(--ink); white-space:pre-wrap;}
  .visit-item .vfollowup{font-size:12.5px; color:var(--amber); margin-top:6px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .btn-primary{display:block; width:100%; background:var(--navy); color:#fff; border:none; border-radius:8px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;}
  .btn-secondary{display:block; width:100%; background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:8px; padding:12px; font-size:14.5px; font-weight:600; cursor:pointer; margin-top:10px;}
  .btn-google{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:#fff; color:#3c4043; border:1px solid #dadce0; border-radius:8px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;}
  .search-box{width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:20px; font-size:14.5px; background:#fff; margin-bottom:12px;}
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
  .filter-chip{flex:none; padding:7px 13px; border-radius:16px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; color:var(--slate); cursor:pointer; white-space:nowrap;}
  .filter-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .toolbar-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .link-btn{background:none; border:none; color:var(--navy); font-size:13px; font-weight:600; cursor:pointer;}
  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--slate); font-size:14px;}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13.5px; z-index:80; opacity:0; transition:opacity 0.25s; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  .followup-alert{background:#FFF4E5; border:1px solid #F0D19A; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:10px; color:#8A5A15;}
  .menu-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--line); font-size:15px; cursor:pointer;}
  .menu-item .chev{color:var(--slate);}
  input[type=file]{display:none;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
  .bar-track{background:#EDEAE1; border-radius:6px; height:9px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px;}
  .share-lead-pick{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .share-preview{width:100%; min-height:180px; padding:12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff;}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Loading Setu…</div></div>

<script>
/* =========================================================
   SETUP REQUIRED: paste your Google OAuth Client ID below.
   See the setup guide from Claude for how to get this.
   ========================================================= */
const CLIENT_ID = "PASTE_YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events";
const DRIVE_FILENAME = "setu-crm-data.json";

// ---------- Reference data ----------
const PROJECTS = ["Ayodhya City", "Kaushalya Bhavan", "Other"];
const SOURCES = ["Walk-in", "Channel Partner", "Reference", "Online Enquiry", "Other"];
const CONFIGS = ["1 RK", "1 BHK", "2 BHK", "2.5 BHK", "3 BHK", "3.5 BHK", "Shop/Commercial", "Other"];
const OCCUPANCY = ["Owned", "Rented", "Living with Family", "Company Provided", "Other"];

const OUTCOMES = [
  {key:"hot", label:"Hot", color:"#B4432F"},
  {key:"warm", label:"Warm", color:"#C9852B"},
  {key:"cold", label:"Cold", color:"#2A7D8C"},
  {key:"eoi", label:"EOI Submitted", color:"#2F7D5C"},
  {key:"revisit", label:"Revisit Planned", color:"#6B5B95"},
  {key:"booking_confirmed", label:"Booking Confirmed", color:"#2F7D5C"},
  {key:"booking_cancelled", label:"Booking Cancelled", color:"#8a8a8a"},
  {key:"lost", label:"Lost", color:"#8a8a8a"},
];
const OUTCOME_MAP = Object.fromEntries(OUTCOMES.map(o=>[o.key,o]));
const REASONS = [
  "High price / Low budget fit","Location issue","Didn't like layout","Loan eligibility issue",
  "Inventory / unit choice issue","Possession timeline mismatch","Comparing with competition",
  "Family visit / approval pending","Booked elsewhere","Needs more time","Non-contactable after visit",
  "General enquiry only","Other"
];
const STAGE_COLORS = {
  new:"#6B7280", hot:"#B4432F", warm:"#C9852B", cold:"#2A7D8C", eoi:"#2F7D5C", revisit:"#6B5B95",
  booking_confirmed:"#2F7D5C", booking_cancelled:"#8a8a8a", lost:"#8a8a8a"
};
const REQUIRED_FIELDS = ["name","phone","age","profession","occupancyType","currentApartmentType","project","configuration","budget","source","lookingFor"];

// ---------- State ----------
let DATA = { leads: [] };
let currentTab = "dashboard";
let currentLeadId = null;
let leadFilter = "all";
let sourceFilter = "all";
let searchTerm = "";
let shareLeadId = null;
let accessToken = null;
let tokenClient = null;
let driveFileId = null;
let gisReady = false;

// ---------- Local cache (always available, works before/without sign-in) ----------
function loadLocal(){
  try{
    const raw = localStorage.getItem("setu_data");
    if(raw) DATA = JSON.parse(raw);
  }catch(e){ DATA = {leads:[]}; }
}
function saveLocal(){
  try{ localStorage.setItem("setu_data", JSON.stringify(DATA)); }catch(e){}
}

// ---------- Google Identity / Drive / Calendar ----------
window.onload = function(){
  initGis();
};
function initGis(){
  const tryInit = ()=>{
    if(window.google && google.accounts && google.accounts.oauth2){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp)=>{
          if(resp && resp.access_token){
            accessToken = resp.access_token;
            await afterSignIn();
          } else {
            showToast("Sign-in didn't complete");
          }
        }
      });
      gisReady = true;
    } else {
      setTimeout(tryInit, 300);
    }
  };
  tryInit();
}
function signIn(){
  if(CLIENT_ID.indexOf("PASTE_YOUR") === 0){
    showToast("Add your Google Client ID in the code first");
    return;
  }
  if(!gisReady){ showToast("Still loading Google sign-in, try again in a moment"); return; }
  tokenClient.requestAccessToken({prompt: accessToken ? "" : "consent"});
}
function signOut(){
  if(accessToken){
    google.accounts.oauth2.revoke(accessToken, ()=>{});
  }
  accessToken = null; driveFileId = null;
  render();
  showToast("Signed out of Google");
}
async function afterSignIn(){
  try{
    await ensureDriveFile();
    await loadFromDrive();
    saveLocal();
    showToast("Connected — synced with Google Drive");
  }catch(e){
    showToast("Connected, but Drive sync had an issue");
  }
  render();
}
async function driveFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Authorization":"Bearer "+accessToken}, opts.headers||{});
  return fetch(url, opts);
}
async function ensureDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const j = await res.json();
  if(j.files && j.files.length){
    driveFileId = j.files[0].id;
  } else {
    const metadata = {name: DRIVE_FILENAME, mimeType:"application/json"};
    const boundary = "setu_boundary";
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(DATA)}\r\n--${boundary}--`;
    const res2 = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`, {
      method:"POST",
      headers:{"Content-Type":`multipart/related; boundary=${boundary}`},
      body
    });
    const j2 = await res2.json();
    driveFileId = j2.id;
  }
}
async function loadFromDrive(){
  if(!driveFileId) return;
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
  const text = await res.text();
  try{
    const parsed = JSON.parse(text);
    if(parsed && parsed.leads) DATA = parsed;
  }catch(e){}
}
async function saveToDrive(){
  if(!accessToken || !driveFileId) return;
  try{
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(DATA)
    });
  }catch(e){}
}
async function saveData(){
  saveLocal();
  await saveToDrive(); // best-effort, no-op if not signed in
}

// ---- Calendar ----
async function addCalendarReminder(title, dateStr, timeStr, notes){
  if(!dateStr) return;
  timeStr = timeStr || "11:00";
  if(accessToken){
    try{
      const start = new Date(`${dateStr}T${timeStr}:00+05:30`);
      const end = new Date(start.getTime()+30*60000);
      const body = {
        summary: title,
        description: notes||"",
        start:{dateTime:start.toISOString(), timeZone:"Asia/Kolkata"},
        end:{dateTime:end.toISOString(), timeZone:"Asia/Kolkata"},
        reminders:{useDefault:false, overrides:[{method:"popup", minutes:30}]}
      };
      const res = await driveFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
      });
      if(res.ok){ showToast("Reminder added to Google Calendar"); return; }
    }catch(e){}
  }
  openCalendarLink(title, dateStr, timeStr, notes);
}
function openCalendarLink(title, dateStr, timeStr, notes){
  timeStr = timeStr || "11:00";
  const start = new Date(`${dateStr}T${timeStr}:00+05:30`);
  const end = new Date(start.getTime()+30*60000);
  const fmt = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(start)}/${fmt(end)}&details=${encodeURIComponent(notes||"")}`;
  window.open(url, "_blank");
}

// ---------- Helpers ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  return `${dt.getDate()} ${dt.toLocaleString('en-IN',{month:'short'})} ${dt.getFullYear()}`;
}
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
function getLead(id){ return DATA.leads.find(l=>l.id===id); }
function latestVisit(lead){ return (lead.visits&&lead.visits.length) ? lead.visits[lead.visits.length-1] : null; }
function currentStageOf(lead){ const v=latestVisit(lead); return v ? v.outcome : "new"; }
function isIncomplete(lead){ return REQUIRED_FIELDS.some(f => !lead[f]); }
function neverVisited(lead){ return !(lead.visits && lead.visits.length); }
function allFollowUps(){
  const out = [];
  DATA.leads.forEach(lead=>{
    const v = latestVisit(lead);
    if(v && v.nextFollowUp){
      out.push({leadId:lead.id, name:lead.name, phone:lead.phone, date:v.nextFollowUp, time:v.nextFollowUpTime, project:lead.project, notes:v.notes});
    }
  });
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

// ---------- Rendering shell ----------
const app = document.getElementById("app");
function render(){
  if(currentTab==="dashboard") renderDashboard();
  else if(currentTab==="leads") renderLeadsList();
  else if(current
